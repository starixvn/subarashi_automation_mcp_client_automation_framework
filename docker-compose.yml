version: '3.8'

services:
  mcp-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-client
    ports:
      - "5001:5001"
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v1/health/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  default:
    name: mcp-network 